name: iOS build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26+
        run: .github/scripts/select-xcode.sh
      - name: Build (iOS Simulator)
        run: |
          xcodebuild \
            -project StyleMatch.xcodeproj \
            -scheme StyleMatch \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build
