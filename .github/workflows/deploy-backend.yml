name: Deploy backend

# Applique les migrations de la base et déploie les Edge Functions sur le
# projet Supabase. Lancement manuel (Actions › Deploy backend › Run workflow),
# et automatique quand le dossier supabase/ change sur main.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["supabase/**"]

concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
      # Les modifications du projet hébergé demandent une confirmation explicite.
      SUPABASE_YES: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Vérifier la configuration
        id: config
        run: |
          missing=""
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD SUPABASE_PROJECT_REF; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              echo "::error::Secrets GitHub manquants :$missing (voir docs/PRODUCTION.md)"
              exit 1
            fi
            echo "::notice::Backend non configuré (secrets manquants :$missing) : déploiement ignoré."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: supabase/setup-cli@v1
        if: steps.config.outputs.ready == 'true'
        with:
          # Version épinglée : la v3 a changé les options des commandes.
          version: 3.1.0

      - name: Lier le projet
        if: steps.config.outputs.ready == 'true'
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --yes

      - name: Appliquer les migrations
        if: steps.config.outputs.ready == 'true'
        run: supabase db push --remote --password "$SUPABASE_DB_PASSWORD" --yes

      - name: Secrets Stripe des Edge Functions
        if: steps.config.outputs.ready == 'true'
        run: |
          args=()
          [ -n "$STRIPE_SECRET_KEY" ] && args+=("STRIPE_SECRET_KEY=$STRIPE_SECRET_KEY")
          [ -n "$STRIPE_WEBHOOK_SECRET" ] && args+=("STRIPE_WEBHOOK_SECRET=$STRIPE_WEBHOOK_SECRET")
          if [ ${#args[@]} -gt 0 ]; then
            supabase secrets set "${args[@]}" --yes
          else
            echo "::warning::Clés Stripe absentes : le paiement ne fonctionnera pas encore."
          fi

      - name: Déployer les Edge Functions
        if: steps.config.outputs.ready == 'true'
        run: supabase functions deploy --use-api --yes

      - name: Résumé
        if: steps.config.outputs.ready == 'true'
        run: |
          {
            echo "### ✅ Backend déployé"
            echo ""
            echo "URL du webhook Stripe : \`https://${SUPABASE_PROJECT_REF}.supabase.co/functions/v1/stripe-webhook\`"
          } >> "$GITHUB_STEP_SUMMARY"
