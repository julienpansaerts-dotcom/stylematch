name: TestFlight

# Lancement manuel : onglet « Actions » › « TestFlight » › « Run workflow »
# (fonctionne aussi depuis l'app mobile GitHub).
on:
  workflow_dispatch:

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  upload:
    runs-on: macos-26
    timeout-minutes: 45
    env:
      BUNDLE_ID: stylematch
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      # Configuration publique de l'app (Settings › Secrets and variables › Actions › Variables).
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
      STRIPE_PUBLISHABLE_KEY: ${{ vars.STRIPE_PUBLISHABLE_KEY }}
      APPLE_PAY_MERCHANT_ID: ${{ vars.APPLE_PAY_MERCHANT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Vérifier les secrets
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          missing=0
          for name in TEAM_ID ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret GitHub manquant pour $name (voir docs/TESTFLIGHT.md)"
              missing=1
            fi
          done
          exit $missing

      - name: Installer la clé API App Store Connect
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          key_dir="$RUNNER_TEMP/private_keys"
          mkdir -p "$key_dir"
          key_path="$key_dir/AuthKey_${ASC_KEY_ID}.p8"
          if printf '%s' "$ASC_KEY_P8" | grep -q "BEGIN PRIVATE KEY"; then
            printf '%s\n' "$ASC_KEY_P8" > "$key_path"
          else
            # Le secret a été collé encodé en base64.
            printf '%s' "$ASC_KEY_P8" | base64 --decode > "$key_path"
          fi
          chmod 600 "$key_path"
          {
            echo "ASC_KEY_PATH=$key_path"
            echo "ARCHIVE_PATH=$RUNNER_TEMP/StyleMatch.xcarchive"
            echo "EXPORT_PATH=$RUNNER_TEMP/export"
          } >> "$GITHUB_ENV"

      - name: Vérifier la configuration App Store Connect
        run: |
          python3 -m pip install --quiet --break-system-packages "pyjwt[crypto]" 2>/dev/null \
            || python3 -m pip install --quiet "pyjwt[crypto]"
          python3 .github/scripts/check-app-store-connect.py

      - name: Sélectionner Xcode 26+
        run: .github/scripts/select-xcode.sh

      - name: Configuration du backend (Supabase / Stripe)
        run: .github/scripts/write-app-config.sh

      - name: Archiver (sans signature)
        run: |
          # Numéro de build unique et croissant (AAAAMMJJHHMM).
          build_number=$(date -u +%Y%m%d%H%M)
          echo "Build number: $build_number"
          xcodebuild \
            -project StyleMatch.xcodeproj \
            -scheme StyleMatch \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$ARCHIVE_PATH" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            CURRENT_PROJECT_VERSION="$build_number" \
            CODE_SIGNING_ALLOWED=NO \
            archive

      - name: Signature ad hoc de l'archive
        # La clé API ne sait pas signer un « archive » : on signe ad hoc, puis
        # l'export ci-dessous re-signe pour l'App Store via les certificats
        # gérés dans le cloud par Apple.
        run: |
          app="$ARCHIVE_PATH/Products/Applications/StyleMatch.app"
          entitlements="$RUNNER_TEMP/StyleMatch.entitlements"
          extra=""
          if [ -n "$SUPABASE_URL" ]; then
            # « Se connecter avec Apple » (activé sur l'identifiant de l'app, voir docs/PRODUCTION.md).
            extra="$extra<key>com.apple.developer.applesignin</key><array><string>Default</string></array>"
          fi
          if [ -n "$APPLE_PAY_MERCHANT_ID" ]; then
            extra="$extra<key>com.apple.developer.in-app-payments</key><array><string>${APPLE_PAY_MERCHANT_ID}</string></array>"
          fi
          cat > "$entitlements" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>application-identifier</key>
            <string>${TEAM_ID}.${BUNDLE_ID}</string>
            <key>com.apple.developer.team-identifier</key>
            <string>${TEAM_ID}</string>
            ${extra}
          </dict>
          </plist>
          PLIST
          plutil -lint "$entitlements"
          codesign --force --sign - --timestamp=none --generate-entitlement-der \
            --entitlements "$entitlements" "$app"
          codesign --verify --deep --strict "$app"

      - name: Exporter et envoyer sur App Store Connect
        run: |
          options="$RUNNER_TEMP/ExportOptions.plist"
          cat > "$options" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>destination</key>
            <string>upload</string>
            <key>teamID</key>
            <string>${TEAM_ID}</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>uploadSymbols</key>
            <true/>
            <key>manageAppVersionAndBuildNumber</key>
            <false/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportPath "$EXPORT_PATH" \
            -exportOptionsPlist "$options" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Conserver les logs d'export en cas d'échec
        if: failure()
        run: |
          mkdir -p "$RUNNER_TEMP/distribution-logs"
          find "${TMPDIR:-/tmp}" /var/folders -maxdepth 6 -name "*.xcdistributionlogs" -type d 2>/dev/null \
            -exec cp -R {} "$RUNNER_TEMP/distribution-logs/" \; || true
          for f in "$RUNNER_TEMP"/distribution-logs/*/IDEDistribution*.log; do
            [ -f "$f" ] || continue
            echo "===== $f"
            grep -iE "error|fail|denied|not found|unauthor" "$f" | tail -40 || true
          done

      - name: Publier les logs d'export
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: distribution-logs
          path: ${{ runner.temp }}/distribution-logs
          if-no-files-found: ignore

      - name: Résumé
        run: |
          {
            echo "### ✅ Build envoyé sur App Store Connect"
            echo ""
            echo "Apple traite le build (10 à 30 min), puis il apparaît dans TestFlight."
            echo "Tu recevras un e-mail d'Apple quand il sera prêt."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Nettoyer la clé
        if: always()
        run: rm -rf "$RUNNER_TEMP/private_keys"
